name: Build ManaSeva APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o Manaseva_Android_MVP.zip -d project

      - name: Find Gradle project
        run: |
          GRADLE=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE" ]; then
            echo "gradlew not found"
            find project -maxdepth 3 -type f
            exit 1
          fi
          echo "GRADLE=$GRADLE" >> "$GITHUB_ENV"
          chmod +x "$GRADLE"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLE")"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManaSeva-APK
          path: project/**/build/outputs/apk/**/*.apk

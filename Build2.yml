name: Build ManaSeva APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p project
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)
          echo "Using ZIP: $ZIP"
          unzip -o "$ZIP" -d project

      - name: Find Gradle project
        run: |
          GRADLE=$(find project -type f -name "gradlew" | head -n 1)
          echo "Using Gradle: $GRADLE"
          test -n "$GRADLE"
          chmod +x "$GRADLE"
          echo "GRADLE=$GRADLE" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLE")"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManaSeva-APK
          path: project/**/build/outputs/apk/**/*.apk
